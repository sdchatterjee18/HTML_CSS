<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>
            Music App
        </title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <link >
    </head>
    <body>
        <div class="screen">
            <div class="mobile_screen">
                <div class="header">
                    <button class="return common_header_button"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="song_text">PLAYING NOW</div>
                    <button class="feature common_header_button"><i class="fa-solid fa-align-justify"></i></button>
                </div>
                <div class="song_image_div_outside">
                    <div class="song_image_div_inside">
                    <img src="" id="song_image">
                </div>
                </div>
                <div class="song_details_div">
                    <span id="song_name"></span>
                    <span id="artist_name"></span>
                </div>
                <div class="duration_div">
                </div>
                <div class="song_control_div">
                    <button class="contoler_button" id="previous" onclick="previous_Song()">
                        <i class="fa-solid fa-backward"></i>
                    </button>
                    <button class="contoler_button" id="pause" onclick="toogle_Song()">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button class="contoler_button" id="next" onclick="next_Song()">
                        <i class="fa-solid fa-forward"></i>
                    </button>
                </div>
            </div>
        </div>
        <audio id="audio">

        </audio>
        <script src="script.js"></script>
    </body>
</html>
