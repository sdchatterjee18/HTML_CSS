<!DOCTYPE html>
<htm lang="eng">
    <head>
        <title>
            Zomato
        </title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    </head>
    <body>
        <div class="Animated_FirstView">
            <video autoplay muted loop class="background_video">
            <source src="https://b.zmtcdn.com/data/file_assets/2627bbed9d6c068e50d2aadcca11ddbb1743095925.mp4" type="video/mp4">
            </video>
            <div class="shadow"></div>
            <div class="content">
                <img src="https://b.zmtcdn.com/web_assets/8313a97515fcb0447d2d77c276532a511583262271.png" class="ZomatoLogoImage">
                <p class="heading">India's #1<br>food delivery app</p>
                <p class="after_heading">Experience fast & easy online ordering<br>on the Zomato app</p>
                <div class="images_section">
                    <img src="https://b.zmtcdn.com/data/o2_assets/aad864bd17860b27634fe621001c32db1739350431.png" class="imgLogo">
                    <img src="https://b.zmtcdn.com/data/o2_assets/df6464de32f4a09262cee301f65aaa661739351256.png" class="imgLogo">
                </div>
                <div class="scroll">
                    <span onclick="scrollToNext()">Scroll down <i class="fa-solid fa-angles-down"></i></span>
                </div>
                
            </div>
            
        </div>
        <div class="main_container">
            <img class="leftSideLine" src="https://b.zmtcdn.com/data/o2_assets/901001826baf04838b1bf505176ff0b11742453501.png">
            <div class="rightSideLineDiv">
                <img class="RightSideLine" src="https://b.zmtcdn.com/data/o2_assets/901001826baf04838b1bf505176ff0b11742453501.png">
            </div>
            <div class="middle_content flex">
                <div class="red_txt">
                    Better food for <br>more people
                </div>
                <div class="grey_txt">
                    <p>For over a decade, we’ve enabled our customers to discover new tastes, delivered right to their doorstep</p>
                </div>
            </div>
            <img src="https://b.zmtcdn.com/data/o2_assets/110a09a9d81f0e5305041c1b507d0f391743058910.png" class="burger">
            <img src="https://b.zmtcdn.com/data/o2_assets/b4f62434088b0ddfa9b370991f58ca601743060218.png" class="momo">
            <img src="https://b.zmtcdn.com/data/o2_assets/70b50e1a48a82437bfa2bed925b862701742892555.png" class="leaves">
            <img src="https://b.zmtcdn.com/data/o2_assets/316495f4ba2a9c9d9aa97fed9fe61cf71743059024.png"
            class="pizza">
        </div>
        <script src="script.js"></script>
    </body>
</html>
