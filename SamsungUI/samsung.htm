<!DOCTYPE html>
<html lang="eng">
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <title>
            samsung
        </title>
    </head>
    <body>
        <div class="first-image">
            <div class="top-div">
              <div class="top-left">
                    <b>Support</b>                  
              </div>
              <a class="top-right" href="https://www.samsung.com/in/business/">
                 <div class="redirect">
                     <b>For Business</b>                   
                 </div>
              </a>               
            </div>
            <div class="second-top-div">
                <div class="second-top-left">
                    <b style="font-size: 20px; font-family: Arial, Helvetica,roboto sans-serif;
                    font-weight: 700;"><b>SAMSUNG</b></b>
                </div>
                <div class="second-top-mid">
                    <a href="https://www.samsung.com/in/offer/" class="mid-series">
                        <div class="shop">
                        Shop
                    </div>
                    </a>   
                    <a href="https://www.samsung.com/in/smartphones/all-smartphones/" class="mid-series">
                        <div class="shop">
                        Mobile
                     </div>
                    </a>               
                    <a href="https://www.samsung.com/in/tvs/all-tvs/" class="mid-series">
                        <div class="shop" >
                        TV & AV
                     </div>
                    </a>
                    <a href="https://www.samsung.com/in/refrigerators/all-refrigerators/" class="mid-series">
                         <div class="shop" style="width: 100px;">
                         Appliances
                         </div>
                    </a>
                   
                    <a href="https://www.samsung.com/in/computers/all-computers/" class="mid-series">
                     <div class="shop" style="width: 170px;">
                        Computers & monitors
                     </div>
                    </a>
                    <a href="https://www.samsung.com/in/watches/all-watches/" class="mid-series">
                        <div class="shop" style="width: 100px;">
                        Wearables
                     </div>
                    </a>
                    <a href="https://www.samsung.com/in/accessories/" class="mid-series">
                        <div class="shop" style="width: 100px;">
                        Accessories
                     </div>
                    </a>                
                </div>
                <div class="second-top-right">
                    <div class="searchbox">                     
                        <div class="search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <div>search</div>
                        </div>
                    </div>
                    <div class="bucket">
                        <a href="https://shop.samsung.com/in/cart" class="mid-series">
                            <span><i class="fa-solid fa-cart-arrow-down"></i></span>
                        </a>
                        <a href="https://account.samsung.com/iam/sign-up/terms" class="mid-series">
                            <span><i class="fa-regular fa-user"></i></span>
                        </a>    
                    </div>
                </div>
            </div>
        </div>

        <div class="second-image">

        </div>
        <div class="parent">
            <div class="child img1" ; id="child1">

            </div>
            <div class="child img2">

            </div>
            <div class="child img3">

            </div>
            <div class="child img4">

            </div>
        </div>
    </body>
</html>
