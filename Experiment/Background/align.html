<!DOCTYPE html>
<html>
    <head> 
        <style>
            body
            {
                margin: 0;
            }
            .parent
            {
                position: relative;
                width: 100vw;
                height: 100vh;
                box-sizing: border-box;
                background: red;
                border: 1px solid white;
            }
            .child2
            {
                position: relative;
                height: 50%;
                width: 35%;
                background-color: black;
                left: 10%;
            }
            .child1
            {
                height:50%;
                width: 40%;
                background-color: white;
                position:absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
            }

        </style>
    </head>
    <body>
        <div class="parent">
           
            <div class="child1">
                <div class="child2">

                </div>
            </div>
        </div>
    </body>
</html>
